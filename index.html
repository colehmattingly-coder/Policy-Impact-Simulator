<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cascade Effect — See policy travel</title>
<style>
:root{--bg:#06111f;--panel:#0b1d2e;--panel2:#0e283d;--line:#244861;--ink:#edf7ff;--muted:#9db4c7;--cyan:#47e3ff;--violet:#a689ff;--good:#9cf1a1;--warn:#ffd071;--bad:#ff7890;--shadow:0 18px 50px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 17% 0,#153d5f 0,transparent 29%),radial-gradient(circle at 90% 15%,#29194f 0,transparent 27%),var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.page{max-width:1420px;margin:auto;padding:22px clamp(15px,3vw,48px) 58px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.brand{font-size:clamp(27px,4vw,46px);font-weight:900;letter-spacing:-.07em;line-height:.9}.brand span{color:var(--cyan)}.sub{font-size:13px;color:var(--muted);max-width:520px}.model{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b4c9d9;border:1px solid #365a74;border-radius:999px;padding:9px 12px;text-align:center}.workspace{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(310px,.72fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#0e2438eF,#071523f5);border-radius:18px;box-shadow:var(--shadow)}.controls{padding:18px}.section-label{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);font-weight:850}.section-label b{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#143a53;font-size:11px}.control-grid{display:grid;grid-template-columns:1.25fr repeat(3,.75fr);gap:10px}.rate-control,.choice{border:1px solid #264d67;background:#071725;border-radius:12px;padding:12px}.rate-control label{display:flex;justify-content:space-between;gap:10px;font-weight:750;font-size:14px}.rate-control output{color:var(--cyan);font-variant-numeric:tabular-nums}.rate-control input{width:100%;margin:12px 0 0;accent-color:var(--cyan)}.choice span{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.choice div{display:flex;gap:5px}.choice button,.preset{border:1px solid #30556d;background:#0a1826;border-radius:7px;padding:6px 7px;cursor:pointer;flex:1;font-size:11px;font-weight:750}.choice button[aria-pressed=true],.preset:hover{background:#17485f;border-color:var(--cyan)}.presets{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.presets span{font-size:12px;color:var(--muted)}.preset{flex:0 0 auto;padding:7px 10px}.cascade{position:relative;padding:14px 0 0}.cascade:before{content:"";position:absolute;left:50%;top:12px;bottom:42px;width:2px;background:linear-gradient(var(--cyan),var(--violet),var(--cyan));box-shadow:0 0 16px var(--cyan);opacity:.65}.node{position:relative;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(110deg,#0a1c2ceb,#0b263bf0);border-radius:18px;padding:16px 18px;margin:0 0 20px;cursor:pointer;transition:transform .22s,border-color .22s,background .22s;box-shadow:var(--shadow)}.node:hover,.node.active{transform:translateY(-2px);border-color:var(--cyan);background:linear-gradient(110deg,#10344a,#0d2640)}.node:after{content:"↓";position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);color:var(--cyan);font-size:19px;text-shadow:0 0 12px var(--cyan)}.node.last:after{display:none}.node-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.node-top h2{margin:0;font-size:16px}.node-tag{font-size:10px;letter-spacing:.09em;color:var(--cyan);font-weight:850}.node p{margin:6px 0 0;color:#b8cada;font-size:13px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.metric{border-left:2px solid var(--violet);padding-left:8px}.metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.metric strong{display:block;font-size:20px;letter-spacing:-.05em;margin-top:2px;font-variant-numeric:tabular-nums}.positive{color:var(--good)!important}.negative{color:var(--bad)!important}.neutral{color:var(--warn)!important}.sector-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.sector-chip{border:1px solid #264a64;border-radius:9px;padding:8px;background:#071827}.sector-chip span{font-size:10px;color:var(--muted)}.sector-chip b{display:block;font-size:15px;margin-top:2px}.bottom-fork{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;position:relative}.basket-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.item{border:1px solid #24465f;border-radius:10px;background:#071725;padding:9px}.item span{display:block;font-size:11px;color:var(--muted)}.item b{display:block;font-size:15px;margin:3px 0}.item em{font-style:normal;font-size:11px;font-weight:750}.finance-mini{display:grid;gap:10px;margin-top:11px}.finance-mini div{border-left:2px solid var(--cyan);padding-left:8px}.finance-mini span{display:block;font-size:10px;color:var(--muted)}.finance-mini b{font-size:19px;letter-spacing:-.04em}.detail{position:sticky;top:16px;padding:20px;min-height:450px}.detail h2{font-size:25px;letter-spacing:-.05em;margin:4px 0 7px}.detail .why{color:#c5d7e4}.why-chain{display:grid;gap:10px;margin:19px 0}.why-step{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start}.why-step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#173a54;color:var(--cyan);font-size:12px}.why-step p{margin:3px 0;color:#c5d5e1;font-size:13px}.detail-card{margin-top:18px;padding:14px;border:1px solid #2b4e68;border-radius:12px;background:#081928}.detail-card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--cyan)}.mini-control{margin-top:9px}.mini-control label{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:10px}.mini-control output{color:var(--cyan)}.mini-control input{width:100%;accent-color:var(--cyan)}.story{margin-top:15px;padding:13px;border-left:3px solid var(--violet);border-radius:8px;background:#151534;color:#d5d4f7;font-size:13px}.term{border-bottom:1px dashed var(--cyan);cursor:help}.term:hover{color:var(--cyan)}.pulse{animation:pulse .55s ease}@keyframes pulse{50%{box-shadow:0 0 0 4px #47e3ff20,var(--shadow)}}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.detail{position:static;min-height:0}.cascade:before{left:24px}.node:after{left:24px}.control-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.page{padding:15px 12px 40px}.top{align-items:flex-start;flex-direction:column}.control-grid,.bottom-fork{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr 1fr}.sector-strip{grid-template-columns:1fr 1fr}.basket-list{grid-template-columns:1fr 1fr}.model{text-align:left}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div><div class="brand">Cascade <span>Effect</span></div><div class="sub">Move one policy lever, then follow the change all the way to everyday prices.</div></div><div class="model">Illustrative teaching model · not live prices or financial advice</div></header>
<div class="workspace">
<section>
  <section class="panel controls" id="policy">
    <div class="section-label"><b>1</b>Start with policy</div>
    <div class="control-grid">
      <div class="rate-control"><label for="rate">Central bank policy rate <output id="rateOut">5.25%</output></label><input id="rate" type="range" min="0" max="10" step=".25" value="5.25"></div>
      <div class="choice"><span>Balance sheet</span><div data-key="balance"><button data-v="-1">QE</button><button data-v="0" aria-pressed="true">Neutral</button><button data-v="1">QT</button></div></div>
      <div class="choice"><span>Government spending</span><div data-key="spend"><button data-v="-1">Lower</button><button data-v="0" aria-pressed="true">Neutral</button><button data-v="1">Higher</button></div></div>
      <div class="choice"><span>Tax stance</span><div data-key="tax"><button data-v="-1">Cuts</button><button data-v="0" aria-pressed="true">Baseline</button><button data-v="1">Hikes</button></div></div>
    </div>
    <div class="presets"><span>Try a scenario:</span><button class="preset" data-preset="hike">Rate hike</button><button class="preset" data-preset="ease">Rate cut</button><button class="preset" data-preset="stimulus">Stimulus</button><button class="preset" data-preset="reset">Reset</button></div>
  </section>
  <section class="cascade" aria-label="Connected policy cascade">
    <button class="node active" data-node="markets"><div class="node-top"><div><div class="node-tag">FIRST WAVE · CLICK TO EXPLAIN</div><h2>Financial markets react first</h2></div><span class="node-tag" id="marketTone">BALANCED</span></div><p>Interest-rate expectations change bond yields, stock valuations, and credit conditions.</p><div class="metric-row"><div class="metric"><span>10Y yield</span><strong id="tenYield">5.55%</strong></div><div class="metric"><span>Curve</span><strong id="curve">Flat</strong></div><div class="metric"><span>Stock signal</span><strong id="stocks">+0.0%</strong></div></div></button>
    <button class="node" data-node="sectors"><div class="node-top"><div><div class="node-tag">SECOND WAVE · CLICK TO EXPLAIN</div><h2>Businesses and jobs feel the pressure</h2></div><span class="node-tag">SECTORS</span></div><p>Borrowing costs and demand reshape expansion plans, hiring, and household choices.</p><div class="sector-strip"><div class="sector-chip"><span>Housing</span><b id="housing">54</b></div><div class="sector-chip"><span>Tech</span><b id="tech">56</b></div><div class="sector-chip"><span>Small business</span><b id="business">46</b></div><div class="sector-chip"><span>Labor</span><b id="labor">55</b></div></div></button>
    <div class="bottom-fork">
      <button class="node last" data-node="basket"><div class="node-top"><div><div class="node-tag">FINAL WAVE · CLICK TO EXPLAIN</div><h2>Everyday basket</h2></div><span class="node-tag" id="basketDelta">+$0/mo</span></div><p>A representative monthly basket helps translate policy into familiar prices.</p><div class="basket-list" id="basketList"></div></button>
      <button class="node last" data-node="personal"><div class="node-top"><div><div class="node-tag">OPTIONAL LENS</div><h2>Personal finance</h2></div></div><p>One simple look at savings versus rate-sensitive debt.</p><div class="finance-mini"><div><span>Monthly interest change</span><b id="personalCash">+$0</b></div><div><span>Savings yield</span><b id="hysa">4.50%</b></div><div><span>Variable debt APR</span><b id="prime">8.25%</b></div></div></button>
    </div>
  </section>
</section>
<aside class="panel detail" id="detail" aria-live="polite"></aside>
</div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id),state={rate:5.25,balance:0,spend:0,tax:0,savings:10000,debt:5000,node:'markets'};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0,signDisplay:'always'}).format(n),plain=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n),pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
const basket=[['Housing',760,.55],['Groceries',380,1],['Utilities',190,.8],['Fuel & transit',220,1.25],['Health basics',110,.45],['Flexible spending',180,.75]];
function tone(n){return n>.4?'positive':n<-.4?'negative':'neutral'}
function explain(data){
 const messages={
 markets:{title:'Why markets move first',lead:'Markets reprice quickly because investors react to expected borrowing costs before most everyday contracts reset.',steps:[['Policy rate shifts','A higher policy rate lifts short-term borrowing costs and usually raises the return investors demand.'],['Bond yields adjust','Existing bonds may fall in price when newly issued bonds offer higher yields.'],['Stocks and credit react','Higher discount rates can pressure stock valuations and make risky borrowing more expensive.']],control:''},
 sectors:{title:'Why sectors do not move equally',lead:'Rate-sensitive sectors feel policy earlier than others because they rely more on financing and future growth expectations.',steps:[['Housing','Mortgage benchmarks move with interest-rate conditions, changing affordability.'],['Tech & growth','Future earnings are discounted more heavily when rates rise.'],['Small business & labor','Loan costs and demand shape expansion and hiring decisions.']],control:''},
 basket:{title:'Why a basket changes more slowly',lead:'Everyday prices reflect broad inflation, energy costs, and demand. They usually respond after markets—not instantly.',steps:[['Housing','Rent and housing costs tend to follow inflation and financing conditions gradually.'],['Groceries & utilities','Input, energy, and demand conditions influence routine bills.'],['Total basket','The total is a teaching estimate of how a policy scenario may feel month to month.']],control:''},
 personal:{title:'A simpler personal lens',lead:'This is intentionally just savings versus variable-rate debt. Change the two balances to see the direction of the interest effect.',steps:[['Savings','Higher policy rates can raise yields on savings accounts.'],['Variable debt','Rates can also make variable debt more expensive.'],['Net effect','Your result is the modeled savings gain minus the modeled debt cost.']],control:'<div class="detail-card"><h3>Try your balances</h3><div class="mini-control"><label for="saveInput">Savings <output id="saveOut"></output></label><input id="saveInput" type="range" min="0" max="50000" step="1000" value="'+state.savings+'"></div><div class="mini-control"><label for="debtInput">Rate-sensitive debt <output id="debtOut"></output></label><input id="debtInput" type="range" min="0" max="30000" step="500" value="'+state.debt+'"></div></div>'}
 };
 const m=messages[data];$('detail').innerHTML='<div class="section-label"><b>?</b>Explore this layer</div><h2>'+m.title+'</h2><p class="why">'+m.lead+'</p><div class="why-chain">'+m.steps.map((x,i)=>'<div class="why-step"><b>'+(i+1)+'</b><div><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div></div>').join('')+'</div>'+m.control+'<div class="story" id="story"></div>';
 if(data==='personal'){ $('saveInput').addEventListener('input',e=>{state.savings=+e.target.value;update()});$('debtInput').addEventListener('input',e=>{state.debt=+e.target.value;update()})}
}
function update(){
 const d=state.rate-5.25, inflation=2.5+state.spend*.5-state.tax*.2-d*.11-state.balance*.14, growth=-d*.27-state.balance*.27+state.spend*.68-state.tax*.28, ten=5.55-d*.06+state.balance*.1+state.spend*.2, curve=ten-(state.rate+.08), stock=-d*2.1-state.balance*1.2+state.spend*2.5-state.tax*.6, tight=50+d*5+state.balance*9-state.spend*8+state.tax*2;
 const scores={housing:54-d*5.8+state.spend*3-state.balance*2,tech:56-d*7+state.spend*6-state.balance*4,business:54-d*4.5+state.spend*7-tight*.16,labor:55+growth*10};
 const hysa=4.5+d*.7-state.balance*.1,prime=state.rate+3,personal=state.savings*(hysa-4.5)/1200-state.debt*(prime-8.25)/1200;
 const items=basket.map(x=>{const shift=(inflation-2.5)*x[2]+(x[0]==='Fuel & transit'?state.spend*.45:0)+(x[0]==='Housing'?d*.06:0);return {...{name:x[0],base:x[1],shift},amount:x[1]*(1+shift/100)}}),base=items.reduce((s,x)=>s+x.base,0),current=items.reduce((s,x)=>s+x.amount,0),basketDiff=current-base;
 $('rateOut').value=state.rate.toFixed(2)+'%';$('tenYield').textContent=ten.toFixed(2)+'%';$('curve').textContent=curve<0?'Inverted':curve<.35?'Flat':'Steepening';$('curve').className=tone(curve);$('stocks').textContent=pct(stock);$('stocks').className=tone(stock);$('marketTone').textContent=tight>60?'TIGHTER':tight<40?'EASIER':'BALANCED';
 Object.entries(scores).forEach(([k,v])=>{$(k).textContent=Math.round(v);$(k).className=tone(v-50)});
 $('basketDelta').textContent=money(basketDiff)+'/mo';$('basketDelta').className='node-tag '+tone(basketDiff);
 $('basketList').innerHTML=items.map(x=>'<div class="item"><span>'+x.name+'</span><b>'+plain(x.amount)+'</b><em class="'+tone(x.shift)+'">'+pct(x.shift)+'</em></div>').join('');
 $('personalCash').textContent=money(personal)+'/mo';$('personalCash').className=tone(personal);$('hysa').textContent=hysa.toFixed(2)+'%';$('prime').textContent=prime.toFixed(2)+'%';
 if($('saveOut')){$('saveOut').value=plain(state.savings);$('debtOut').value=plain(state.debt)}
 const line=state.rate>5.25?'Higher rates tighten borrowing conditions before they reach businesses and the basket.':state.rate<5.25?'Lower rates support borrowing conditions, but can add demand and price pressure later.':'This is the neutral starting point: change one lever and watch each layer respond.';
 $('story').textContent=line+' Current modeled basket change: '+money(basketDiff)+' per month; personal interest change: '+money(personal)+' per month.';
 document.querySelectorAll('.node').forEach(n=>n.classList.remove('pulse'));requestAnimationFrame(()=>document.querySelectorAll('.node').forEach(n=>n.classList.add('pulse')));
}
function setPreset(name){if(name==='hike')Object.assign(state,{rate:8,balance:1,spend:0,tax:0});if(name==='ease')Object.assign(state,{rate:2.5,balance:-1,spend:0,tax:0});if(name==='stimulus')Object.assign(state,{rate:4.5,balance:-1,spend:1,tax:-1});if(name==='reset')Object.assign(state,{rate:5.25,balance:0,spend:0,tax:0});$('rate').value=state.rate;document.querySelectorAll('.choice div').forEach(group=>group.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===state[group.dataset.key]))));update()}
$('rate').addEventListener('input',e=>{state.rate=+e.target.value;update()});document.querySelectorAll('.choice div').forEach(group=>group.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;state[group.dataset.key]=+e.target.dataset.v;group.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.target)));update()}));document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.preset)));document.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{state.node=n.dataset.node;document.querySelectorAll('.node').forEach(x=>x.classList.toggle('active',x===n));explain(state.node);update()}));explain('markets');update();
})();
</script>
</body>
</html>
